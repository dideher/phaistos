name: Django CI

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        db: [sqlite, mysql]
        python-version: ["3.13", "3.14"]
        include:
          - db: mysql
            db_user: root
            db_password: root
    steps:
    - uses: actions/checkout@v4
    - name: Install uv and set up Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.12.23"
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Start MySQL
      if: matrix.db == 'mysql'
      run: sudo systemctl start mysql.service
    - name: Install Dependencies
      run: uv sync --locked
    - name: Run Tests
      run: |
        cd app && uv run python manage.py test
